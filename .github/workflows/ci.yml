# CI и выпуск @verdeect/platform-client (prd.md D1, D10, NFR-6, AC-16, AC-17; образец — verdeect-auth ci.yml).
#
# Jobs, связанные через needs: lint → test → build → publish; каждый ставит зависимости сам (make install).
# Проверки — на каждый push в ветку и pull_request. Уровни тестов (AGENTS.md): test — матрица Node 22 и 24
# (engines.node ">=22.12"), шаги make test (слой U) и make test-timing (perf AC-17 — тот же job, prd.md AC-17);
# build — матрица Node 22 и 24, make build pack-check (AC-16), dist/ выгружается из Node 22;
# lint — Node 22 (минимальная поддерживаемая версия). TEST_TIMEOUT_SCALE в CI — 1.
# test-load: нагрузочного набора нет — ручного job нет.
# publish — только на тег v<major>.<minor>.<patch> после зелёных проверок, GitHub-hosted runner, Node 24 и
# npm >= 11.15: scripts/publish.mjs сверяет тег с version, проверяет, что версии нет в npm, и запускает
# npm publish --access public из собранного dist/.
#
# Разовая настройка (docs/releasing.md):
#   - environment `npm` с правилом развёртывания «только теги v*»;
#   - ruleset на теги v*: создание — только мейнтейнеры, удаление и перезапись запрещены;
#   - секретов нет: NPM_TOKEN / NODE_AUTH_TOKEN не используются, публикация только через OIDC (id-token: write);
#   - 1.0.0 мейнтейнер публикует вручную (D1), затем npm trust github (smskin/verdeect-platform-client, ci.yml,
#     environment npm) и запрет публикации токенами. Job publish для тега v1.0.0 падает на «версия уже
#     опубликована» — это ожидаемо.
# Слой C (make test-integration, псевдоним make test-contract) и make test-full в CI не запускаются —
# только локально перед слиянием и тегом (D10).
# continue-on-error нигде не используется.
name: ci

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

# Множитель тайм-аутов конфигов Vitest: в CI всегда 1 (поднимается только локально).
env:
  TEST_TIMEOUT_SCALE: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: make install
        run: make install
      - name: make lint
        run: make lint
      - name: make analyse
        run: make analyse

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: make install
        run: make install
      - name: make test
        run: make test
      - name: make test-timing
        run: make test-timing

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: make install
        run: make install
      - name: make build pack-check
        run: make build pack-check
      # publish скачивает один артефакт dist — из минимальной поддерживаемой версии Node.
      - if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    # Права job заменяют права workflow целиком: contents — для checkout, id-token — для npm Trusted Publishing (OIDC).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Без registry-url: .npmrc с _authToken=${NODE_AUTH_TOKEN} не нужен, реестр по умолчанию — registry.npmjs.org.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Trusted Publishing требует npm >= 11.15; npm из Node 24 может быть старее.
      - name: npm >= 11.15
        run: npm install -g npm@^11.15.0
      - name: npm version
        run: npm --version
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Авторизация — только OIDC (Trusted Publishing): npm обменивает id-token на токен публикации. Секретов нет (D1).
      - name: publish
        run: node scripts/publish.mjs
